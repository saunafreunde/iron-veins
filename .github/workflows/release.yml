name: Release

# SPEC2 M25: "ein Git-Tag ohne Handarbeit Installer, Web-Build und
# Attributions-Datei erzeugt".
#
# The rule this file is built on: a release must be a pure function of the tag.
# Nothing here reads a file from a developer's machine, nothing is uploaded by
# hand, and the attribution file is GENERATED from the installed dependency
# tree rather than checked in - so a release cannot ship a credits list that
# was true three months ago.
#
# It deliberately does NOT re-run the test suite. `ci.yml` runs on every push
# including the commit the tag points at, and duplicating a forty-minute matrix
# here would either double the wait for a release or tempt somebody to skip it.
# What this workflow guarantees is that the artefacts come from the tagged
# commit; what guarantees the tagged commit is sound is the CI run on it.

on:
  push:
    tags: ['v*']
  # A dry run without cutting a tag: the same jobs, artefacts uploaded to the
  # run instead of to a release. Every step below that could only work for a
  # real tag is guarded on the event, so this path is the whole workflow and
  # not a shortened imitation of it.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ----------------------------------------------------------------- web build
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Before the build, because vite copies public/ into dist/ - the notices
      # ship with the web build rather than beside it.
      - name: Third-party notices, generated from the dependency tree
        run: npm run attribution

      - name: Web build
        run: npm run build

      - name: The notices really are in the artefact
        # A generated file that silently stops being copied is exactly the
        # failure this whole mechanism exists to prevent, and it would be
        # invisible in a green build otherwise.
        run: test -s dist/THIRD-PARTY.txt

      - uses: actions/upload-artifact@v4
        with:
          name: iron-veins-web
          path: dist
          if-no-files-found: error

  # ------------------------------------------------------- desktop MSI + NSIS
  desktop:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # -------------------------------------------------- code-signing gate
      #
      # THE INTEGRATION POINT SPEC2 M25 ASKS FOR: signed when the certificate
      # secret exists, and a clear warning when it does not.
      #
      # The presence check is its own step because a secret cannot be read in a
      # job-level `if:` and, more importantly, because the WARNING has to be
      # unmissable. An unsigned Windows installer triggers SmartScreen on every
      # machine that has not seen the binary before, and a release that quietly
      # shipped unsigned is a support queue nobody connected to this file.
      #
      # Owner decision, with the default proposed: an OV or EV code-signing
      # certificate for Levando GmbH, stored as the two repository secrets
      # below. Until they exist the release is unsigned ON PURPOSE and says so
      # in its own notes - see RELEASE.md.
      - name: Is there a signing certificate?
        id: signing
        shell: bash
        run: |
          if [ -n "${{ secrets.WINDOWS_CERTIFICATE }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: WARNING - this release will be UNSIGNED
        if: steps.signing.outputs.available != 'true'
        shell: bash
        run: |
          echo "::warning title=Unsigned release::No WINDOWS_CERTIFICATE secret is set."
          echo "The MSI and the NSIS installer will be UNSIGNED."
          echo "Windows SmartScreen will warn every user who has not seen this binary before."
          echo "Set the WINDOWS_CERTIFICATE (base64 PFX) and WINDOWS_CERTIFICATE_PASSWORD"
          echo "secrets to sign, or accept the warning deliberately - see RELEASE.md."

      - name: Version, notices, installers
        # `build:desktop` is `version:sync && attribution && tauri build`: the
        # three files that carry the version are written from package.json
        # first, so an installer can never be named one thing and report
        # another, and the notices are generated before the bundler copies
        # public/ into the application.
        #
        # Tauri signs when it is given a certificate and does not when it is
        # not; the two variables are empty on the unsigned path, which is the
        # documented behaviour rather than a trick.
        env:
          TAURI_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          TAURI_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run build:desktop

      - uses: actions/upload-artifact@v4
        with:
          name: iron-veins-desktop
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            public/THIRD-PARTY.txt
          if-no-files-found: error

  # ------------------------------------------------------------ the release
  publish:
    needs: [web, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: One archive of the web build
        run: |
          cd artifacts/iron-veins-web
          zip -r ../iron-veins-web.zip .

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/iron-veins-web.zip
            artifacts/iron-veins-desktop/*
          body: |
            Installers, the web build and the generated third-party notices.

            The release is created as a DRAFT on purpose: the commercial
            readiness checklist in RELEASE.md is a set of owner decisions
            (licence text, name and trademark, the crash-bundle privacy note),
            and a workflow must not make them by publishing.
