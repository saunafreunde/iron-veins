name: CI

# Everything that can be checked without a GPU, on every push.
#
# The determinism suite is the reason this file exists. It replays fifty
# thousand ticks four times and compares hashes, and it is the one test in the
# project that cannot be repaired after the fact - a divergence found a month
# later is a month of commits to bisect. So it runs on its own step, before the
# rest, and its failure is unambiguous in the log.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    # The balance suite plays several twenty-five year games and the
    # determinism suite four fifty-thousand-tick runs; the default ten minutes
    # is not enough and a timeout that fires is indistinguishable from a bug.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint, including the architecture laws
        run: npm run lint

      - name: Determinism - must never be red
        run: npm run test:determinism

      - name: Everything else
        run: npm test

  # SPEC2 6.3, from M10: the determinism suite additionally runs on Linux.
  # The cross-OS evidence is the pinned canonical hash in
  # tests/determinism/fixtures/canonical-hash.json - both this job and the
  # Windows job above assert the same world hash against the same pin, so a
  # platform that computes differently fails here by name. Locally the same
  # comparison is `npm run test:determinism:cross`.
  determinism-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Determinism on Linux - same pin as Windows
        run: npm run test:determinism
