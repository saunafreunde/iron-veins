name: CI

# Everything that can be checked without a GPU, on every push.
#
# The determinism suite is the reason this file exists. It replays fifty
# thousand ticks four times and compares hashes, and it is the one test in the
# project that cannot be repaired after the fact - a divergence found a month
# later is a month of commits to bisect. So it runs on its own step, before the
# rest, and its failure is unambiguous in the log.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    # The balance suite plays several twenty-five year games and the
    # determinism suite four fifty-thousand-tick runs; the default ten minutes
    # is not enough and a timeout that fires is indistinguishable from a bug.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint, including the architecture laws
        run: npm run lint

      - name: Determinism - must never be red
        run: npm run test:determinism

      - name: Everything else
        run: npm test

  # SPEC2 6.3, from M10: the determinism suite additionally runs on Linux.
  # The cross-OS evidence is the pinned canonical hash in
  # tests/determinism/fixtures/canonical-hash.json - both this job and the
  # Windows job above assert the same world hash against the same pin, so a
  # platform that computes differently fails here by name. Locally the same
  # comparison is `npm run test:determinism:cross`.
  determinism-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Determinism on Linux - same pin as Windows
        run: npm run test:determinism

  # SPEC2 M16, 6.3: the proof job. Two pieces of evidence that are worth having
  # on every push and too slow to sit inside every local `npm test`:
  #
  #  - the long-run soak - a recorded twenty-five year AI game replayed to the
  #    hashes it committed to at every game-year checkpoint (measured 49 s of
  #    pure simulation on the reference machine);
  #  - the balance suite with EVERY desync twin. The default run twins the
  #    seven cheap scenarios; the two quarter-century AI scenarios cost 143 s
  #    of the 186 s a complete twin takes, so they are switched on here rather
  #    than on every developer's machine (tests/balance/determinism.ts states
  #    the split and the measurements);
  #  - and, since D-220, the same variable switches aiGame's AI acceptance
  #    sweep from two seeds to four. That file asserted on ONE seed for the
  #    whole project and every claim it made about the AI was a property of
  #    that seed; a quarter century costs 40-70 s, so the full sweep is +150 s
  #    per push here rather than +13 s on every local run.
  #
  # It runs on windows-latest, the platform both pins were recorded on. The
  # cross-OS question is D-137's and has its own fixture, deliberately sized to
  # be cheap on two runners; putting a quarter-century AI game on that surface
  # is a separate decision with its own cost.
  soak:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Long-run soak - a quarter century replayed to its pinned hashes
        run: npm run test:soak

      - name: Balance suite as a desync guard - every scenario twice
        run: npm run test:balance
        env:
          IRON_VEINS_BALANCE_HASH: all
